[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triagepilot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi", "uvicorn[standard]", "pydantic>=2", "pydantic-settings",
  "langgraph", "scikit-learn", "pandas", "numpy", "joblib",
  "sentence-transformers", "httpx", "tenacity", "psycopg[binary]", "pgvector",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx"]

[tool.setuptools]
packages = ["triagepilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

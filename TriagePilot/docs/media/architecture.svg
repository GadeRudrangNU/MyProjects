<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#43566b"/>
    </marker>
  </defs>
  <rect width="980" height="600" rx="14" fill="#ffffff" stroke="#d5dde5"/>

  <rect x="24" y="24" width="420" height="552" rx="12" fill="#eef5f3" stroke="#9cc3ba"/>
  <text x="44" y="52" font-size="16" font-weight="600" fill="#1f4e5f">ServiceNow  (JavaScript)</text>

  <rect x="48" y="72" width="372" height="52" rx="8" fill="#fff" stroke="#9cc3ba"/>
  <text x="64" y="94" font-size="13" font-weight="600" fill="#1d2733">New incident</text>
  <text x="64" y="112" font-size="12" fill="#52606d">async business rule, skips imported history</text>

  <rect x="48" y="146" width="372" height="64" rx="8" fill="#fff" stroke="#9cc3ba"/>
  <text x="64" y="168" font-size="13" font-weight="600" fill="#1d2733">TriageClient script include</text>
  <text x="64" y="186" font-size="12" fill="#52606d">strips emails, phones, IPs · creates AI Triage Run (queued)</text>
  <text x="64" y="202" font-size="12" fill="#52606d">POST /v1/triage through the tunnel URL</text>

  <rect x="48" y="304" width="372" height="64" rx="8" fill="#fff" stroke="#9cc3ba"/>
  <text x="64" y="326" font-size="13" font-weight="600" fill="#1d2733">Scripted REST API  /result</text>
  <text x="64" y="344" font-size="12" fill="#52606d">least-privilege integration user · validates · idempotent</text>
  <text x="64" y="360" font-size="12" fill="#52606d">updates the run record</text>

  <rect x="48" y="392" width="372" height="64" rx="8" fill="#fff" stroke="#9cc3ba"/>
  <text x="64" y="414" font-size="13" font-weight="600" fill="#1d2733">Flow: route the result</text>
  <text x="64" y="432" font-size="12" fill="#52606d">confident and priority 3-4: set category + group</text>
  <text x="64" y="448" font-size="12" fill="#52606d">otherwise: approval for the Service Desk</text>

  <rect x="48" y="480" width="176" height="76" rx="8" fill="#fff" stroke="#9cc3ba"/>
  <text x="64" y="502" font-size="13" font-weight="600" fill="#1d2733">Incident form</text>
  <text x="64" y="520" font-size="12" fill="#52606d">banner, Accept,</text>
  <text x="64" y="536" font-size="12" fill="#52606d">Reject, Re-run</text>
  <rect x="244" y="480" width="176" height="76" rx="8" fill="#fff" stroke="#9cc3ba"/>
  <text x="260" y="502" font-size="13" font-weight="600" fill="#1d2733">Dashboard + ATF</text>
  <text x="260" y="520" font-size="12" fill="#52606d">routing, accuracy,</text>
  <text x="260" y="536" font-size="12" fill="#52606d">latency, ACL tests</text>

  <rect x="536" y="24" width="420" height="552" rx="12" fill="#f1f1fa" stroke="#aaa6dd"/>
  <text x="556" y="52" font-size="16" font-weight="600" fill="#3a3478">Agent service  (Python, FastAPI + LangGraph)</text>

  <rect x="560" y="72" width="372" height="40" rx="8" fill="#fff" stroke="#aaa6dd"/>
  <text x="576" y="97" font-size="13" font-weight="600" fill="#1d2733">202 Accepted · run key = sys_id + mod count</text>

  <g font-size="13" fill="#1d2733">
    <rect x="560" y="128" width="372" height="30" rx="6" fill="#fff" stroke="#aaa6dd"/><text x="576" y="148">1  Normalize  (second PII pass)</text>
    <rect x="560" y="164" width="372" height="30" rx="6" fill="#fff" stroke="#aaa6dd"/><text x="576" y="184">2  Classify  (TF-IDF + logistic regression, calibrated)</text>
    <rect x="560" y="200" width="372" height="30" rx="6" fill="#fff" stroke="#aaa6dd"/><text x="576" y="220">3  Retrieve  (5 similar tickets, 3 articles)</text>
    <rect x="560" y="236" width="372" height="30" rx="6" fill="#fff" stroke="#aaa6dd"/><text x="576" y="256">4  Decide  (≥ 0.85 fast path, else local LLM picks top 3)</text>
    <rect x="560" y="272" width="372" height="30" rx="6" fill="#fff" stroke="#aaa6dd"/><text x="576" y="292">5  Draft  (reply grounded in retrieved articles)</text>
    <rect x="560" y="308" width="372" height="30" rx="6" fill="#fff" stroke="#aaa6dd"/><text x="576" y="328">6  Validate  (schema, category, group, citations; retry once)</text>
    <rect x="560" y="344" width="372" height="30" rx="6" fill="#fff" stroke="#aaa6dd"/><text x="576" y="364">7  Callback  (result + trace to ServiceNow)</text>
  </g>

  <rect x="560" y="400" width="176" height="64" rx="8" fill="#fff" stroke="#aaa6dd"/>
  <text x="576" y="422" font-size="13" font-weight="600" fill="#1d2733">Ollama</text>
  <text x="576" y="440" font-size="12" fill="#52606d">local model, JSON output</text>
  <text x="576" y="456" font-size="12" fill="#52606d">checked against schemas</text>
  <rect x="756" y="400" width="176" height="64" rx="8" fill="#fff" stroke="#aaa6dd"/>
  <text x="772" y="422" font-size="13" font-weight="600" fill="#1d2733">Vector store</text>
  <text x="772" y="440" font-size="12" fill="#52606d">pgvector or in-memory</text>
  <text x="772" y="456" font-size="12" fill="#52606d">tickets + articles</text>

  <rect x="560" y="488" width="372" height="68" rx="8" fill="#fff" stroke="#aaa6dd"/>
  <text x="576" y="510" font-size="13" font-weight="600" fill="#1d2733">Knowledge agent</text>
  <text x="576" y="528" font-size="12" fill="#52606d">on resolve: drafts a kb article from the close notes,</text>
  <text x="576" y="544" font-size="12" fill="#52606d">skips it when a near-duplicate already exists</text>

  <g stroke="#43566b" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M234 124 V146"/>
    <path d="M420 178 H540 V92 H560"/>
    <path d="M560 356 H470 V336 H420"/>
    <path d="M234 368 V392"/>
    <path d="M234 456 V480"/>
  </g>
  <text x="440" y="170" font-size="11" fill="#43566b" text-anchor="end" transform="translate(0,-12)"></text>
  <text x="500" y="196" font-size="11" fill="#43566b">HTTPS + token</text>
  <text x="470" y="384" font-size="11" fill="#43566b" text-anchor="middle">basic auth</text>
</svg>

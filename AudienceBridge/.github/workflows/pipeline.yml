name: pipeline

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      regen_crm:
        description: "Rebuild the synthetic CRM"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Run pipeline (dry run)
        run: python -m audiencebridge run-all ${{ inputs.regen_crm && '--regen-crm' || '' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            reports/
            activation_payloads/
          if-no-files-found: ignore

      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Pipeline run failed ($(date -u +%F))" \
            --body "See the run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

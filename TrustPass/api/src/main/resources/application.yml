spring:
  application:
    name: trustpass-api
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
  tracing:
    sampling:
      probability: 1.0

logging:
  structured:
    format:
      console: logstash
  level:
    root: INFO
    org.hibernate.orm.deprecation: WARN

springdoc:
  swagger-ui:
    path: /swagger-ui.html

trustpass:
  db:
    embedded: true
    port: 5434
    data-dir: .data/pg
  seed:
    enabled: ${TRUSTPASS_SEED:false}
  storage:
    path: uploads

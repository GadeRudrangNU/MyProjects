name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build, test and enforce coverage
        run: ./mvnw -B verify
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: |
            api/target/site/jacoco
            worker/target/site/jacoco
      - name: Build container images without Docker
        run: ./mvnw -B -DskipTests package jib:buildTar -pl api,worker -am
      - name: Scan the API image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          input: api/target/jib-image.tar
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan the worker image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          input: worker/target/jib-image.tar
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Generated API client is up to date
        run: |
          npm run api:generate
          git diff --exit-code src/api/generated
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  partner-demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: partner-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: partner-demo/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    needs: [backend, web, partner-demo]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Start the stack
        run: ./scripts/dev-up.sh
      - name: Install browser
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run end to end and accessibility tests
        working-directory: web
        run: npm run e2e
      - name: Stack logs
        if: failure()
        run: tail -n 200 logs/*.log
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report

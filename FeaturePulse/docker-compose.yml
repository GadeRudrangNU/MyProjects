# Standard local database: PostgreSQL 16 with the pgvector extension.
#   docker compose up -d db
#   set DATABASE_URL=postgresql://featurepulse:featurepulse@localhost:5432/featurepulse   (see .env.example)
# Without Docker, leave DATABASE_URL unset: the app starts an embedded PostgreSQL+pgvector (pgserver) in data/pgdata.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: featurepulse
      POSTGRES_PASSWORD: featurepulse
      POSTGRES_DB: featurepulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

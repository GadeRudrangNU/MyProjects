[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "DJ"]
ignore = ["S101", "DJ001", "DJ008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]
"scripts/*" = ["E501", "S608", "S104", "S310", "S311", "S603", "S607", "S105", "S106"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "payflow.settings_test"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = ["slow: long-running tests"]
filterwarnings = ["ignore:No directory at"]

[tool.coverage.run]
source = ["core", "ledger", "payments", "fraud", "webhooks", "backoffice"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.mypy]
python_version = "3.11"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
ignore_missing_imports = true
check_untyped_defs = false
exclude = ["migrations", "tests", "scripts"]

[tool.django-stubs]
django_settings_module = "payflow.settings"

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

# Full stack: PostgreSQL, Redis, API (gunicorn), Celery worker + beat, dashboard, Prometheus, Grafana.
#   docker compose up --build
#   docker compose exec api python manage.py seed_demo --no-frontend-env     # prints an API key
# Dashboard http://localhost:8080 | API docs http://localhost:8000/api/docs/ | Grafana http://localhost:3000 (admin/admin)
# Everything here is free and local. The defaults below are for local development only.

x-backend: &backend
  build: ./backend
  environment: &backend-env
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-development-only-change-me}
    DJANGO_ALLOWED_HOSTS: "*"
    DATABASE_URL: postgresql://payflow:${POSTGRES_PASSWORD:-payflow}@db:5432/payflow
    CELERY_BROKER_URL: redis://redis:6379/0
    CORS_ALLOWED_ORIGINS: http://localhost:8080,http://localhost:5173
    WEBHOOK_ALLOW_PRIVATE_HOSTS: "1"
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payflow}
      POSTGRES_DB: payflow
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *backend
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "1"
    ports: ["8000:8000"]

  worker:
    <<: *backend
    command: ["celery", "-A", "payflow", "worker", "-l", "info", "--concurrency", "4"]
    healthcheck: { disable: true }  # the image's HTTP health check only applies to the API
    depends_on:
      api: { condition: service_healthy }

  beat:
    <<: *backend
    command: ["celery", "-A", "payflow", "beat", "-l", "info", "-s", "/tmp/celerybeat-schedule"]
    healthcheck: { disable: true }
    depends_on:
      api: { condition: service_healthy }

  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [api]

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    depends_on: [api]

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/payflow.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:

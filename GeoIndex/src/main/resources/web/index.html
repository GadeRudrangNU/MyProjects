<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeoIndex</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #0f1722; --panel: #16212f; --line: #243447; --text: #e6edf5; --muted: #8aa0b6;
    --accent: #3da9fc; --enter: #2ecc71; --exit: #ff6b6b; --hit: #ffd166;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { display: grid; grid-template-columns: 1fr 340px; grid-template-rows: auto 1fr; height: 100%; }
  header { grid-column: 1 / 3; display: flex; align-items: center; gap: 24px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .3px; }
  .stat { display: flex; flex-direction: column; min-width: 90px; }
  .stat b { font-size: 15px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .6px; }
  #map { height: 100%; background: #0b1220; }
  aside { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  section { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  section h2 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); }
  .modes { display: flex; gap: 6px; flex-wrap: wrap; }
  button { background: #1d2b3c; color: var(--text); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 10px; cursor: pointer; font: inherit; }
  button.active { background: var(--accent); border-color: var(--accent); color: #04121f; font-weight: 600; }
  button:hover { border-color: var(--accent); }
  label { display: flex; align-items: center; gap: 8px; margin-top: 8px; color: var(--muted); }
  input[type=range] { flex: 1; }
  #hits, #events { overflow-y: auto; min-height: 0; flex: 1; padding: 0; margin: 0; list-style: none; }
  #hits li, #events li { padding: 5px 14px; border-bottom: 1px solid #1c2a3b; font-variant-numeric: tabular-nums;
    display: flex; justify-content: space-between; gap: 8px; }
  .badge { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 10px; color: #04121f; }
  .badge.enter { background: var(--enter); } .badge.exit { background: var(--exit); }
  .muted { color: var(--muted); }
  #hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .events-wrap { display: flex; flex-direction: column; min-height: 0; flex: 1; }
  @media (max-width: 800px) { #app { grid-template-columns: 1fr; grid-template-rows: auto 55% 1fr; } aside { border-left: 0; } header { grid-column: 1; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>GeoIndex</h1>
    <div class="stat"><b id="s-size">–</b><span>entities</span></div>
    <div class="stat"><b id="s-index">–</b><span>index</span></div>
    <div class="stat"><b id="s-ups">–</b><span>updates / s</span></div>
    <div class="stat"><b id="s-uq">–</b><span>update p99</span></div>
    <div class="stat"><b id="s-nq">–</b><span>nearest p99</span></div>
    <div class="stat"><b id="s-queue">–</b><span>queue depth</span></div>
    <div class="stat"><b id="s-ev">–</b><span>zone events</span></div>
  </header>
  <div id="map"></div>
  <aside>
    <section>
      <h2>Click mode</h2>
      <div class="modes">
        <button id="m-nearest" class="active">Nearest k</button>
        <button id="m-zone">Add zone</button>
        <button id="m-clear">Clear zones</button>
      </div>
      <label>k <input id="k" type="range" min="1" max="25" value="5"><span id="k-val">5</span></label>
      <label>zone radius <input id="radius" type="range" min="150" max="2500" step="50" value="700"><span id="radius-val">700 m</span></label>
      <div id="hint">Click the map to find the nearest entities from that point.</div>
    </section>
    <section><h2>Nearest results <span id="nq-ms" class="muted"></span></h2></section>
    <ul id="hits"></ul>
    <section><h2>Zone events (live over WebSocket)</h2></section>
    <ul id="events"></ul>
  </aside>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const map = L.map('map', { preferCanvas: true, zoomControl: true }).setView([40.75, -73.98], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18, attribution: '&copy; OpenStreetMap contributors', className: 'dim-tiles'
  }).addTo(map);
  const style = document.createElement('style');
  style.textContent = '.dim-tiles{filter:brightness(.62) saturate(.7)}' +
    '.zone-label{background:#16212f;color:#ffd166;border:1px solid #243447;box-shadow:none;font-size:11px;padding:1px 6px}' +
    '.zone-label:before{display:none}';
  document.head.appendChild(style);

  const canvas = L.canvas({ padding: 0.3 });
  const markers = new Map();
  const overlay = L.layerGroup().addTo(map);
  const zoneLayers = new Map();
  let mode = 'nearest';
  let eventCount = 0;

  const fmtMs = (v) => v == null ? '–' : (v < 1 ? (v * 1000).toFixed(0) + ' µs' : v.toFixed(2) + ' ms');

  async function refreshEntities() {
    const b = map.getBounds();
    const c = b.getCenter();
    const radius = Math.min(50000, c.distanceTo(b.getNorthEast()));
    try {
      const res = await fetch(`/v1/within?lat=${c.lat}&lon=${c.lng}&radius=${radius}&limit=4000`);
      const data = await res.json();
      const seen = new Set();
      for (const e of data.results) {
        seen.add(e.id);
        const m = markers.get(e.id);
        if (m) m.setLatLng([e.lat, e.lon]);
        else markers.set(e.id, L.circleMarker([e.lat, e.lon], { renderer: canvas, radius: 2.5, weight: 0, fillOpacity: .85, fillColor: '#3da9fc' }).addTo(map));
      }
      for (const [id, m] of markers) if (!seen.has(id)) { map.removeLayer(m); markers.delete(id); }
    } catch (e) { /* the next poll retries */ }
  }

  async function refreshStats() {
    try {
      const s = await (await fetch('/metrics')).json();
      $('s-size').textContent = s.indexSize.toLocaleString();
      $('s-index').textContent = s.indexType;
      $('s-ups').textContent = Math.round(s.throughput.updatesPerSecond).toLocaleString();
      $('s-uq').textContent = fmtMs(s.updateLatency.count ? s.updateLatency.p99Ms : null);
      $('s-nq').textContent = fmtMs(s.nearestLatency.count ? s.nearestLatency.p99Ms : null);
      $('s-queue').textContent = `${s.queueDepth} / ${s.queueCapacity}`;
      $('s-ev').textContent = s.eventsPublished.toLocaleString();
    } catch (e) { /* ignore */ }
  }

  async function loadZones() {
    const zones = await (await fetch('/v1/zones')).json();
    for (const z of zones) drawZone(z);
  }

  function drawZone(z) {
    if (zoneLayers.has(z.id)) return;
    const circle = L.circle([z.lat, z.lon], { radius: z.radiusMeters, color: '#ffd166', weight: 2, fillOpacity: .08 })
      .bindTooltip(z.name, { permanent: true, direction: 'top', className: 'zone-label', offset: [0, -2] }).addTo(map);
    zoneLayers.set(z.id, circle);
  }

  async function nearest(latlng) {
    const k = +$('k').value;
    const t0 = performance.now();
    const res = await fetch(`/v1/nearest?lat=${latlng.lat}&lon=${latlng.lng}&k=${k}`);
    const data = await res.json();
    const rtt = performance.now() - t0;
    overlay.clearLayers();
    L.circleMarker(latlng, { radius: 7, color: '#fff', weight: 2, fillColor: '#ff6b6b', fillOpacity: 1 }).addTo(overlay);
    const list = $('hits');
    list.innerHTML = '';
    data.results.forEach((r, i) => {
      L.polyline([latlng, [r.lat, r.lon]], { color: '#ffd166', weight: 1.5, opacity: .9 }).addTo(overlay);
      L.circleMarker([r.lat, r.lon], { radius: 6, color: '#ffd166', weight: 2, fillOpacity: 0 }).addTo(overlay);
      const li = document.createElement('li');
      li.innerHTML = `<span>${i + 1}. ${r.id}</span><span class="muted">${r.distanceMeters.toFixed(0)} m</span>`;
      list.appendChild(li);
    });
    $('nq-ms').textContent = `round trip ${rtt.toFixed(1)} ms`;
  }

  async function addZone(latlng) {
    const id = 'zone-' + (zoneLayers.size + 1) + '-' + Math.random().toString(36).slice(2, 5);
    const zone = { id, name: 'Zone ' + (zoneLayers.size + 1), lat: latlng.lat, lon: latlng.lng, radiusMeters: +$('radius').value };
    const res = await fetch('/v1/zones', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(zone) });
    if (res.ok) drawZone(zone);
  }

  function setMode(next) {
    mode = next;
    $('m-nearest').classList.toggle('active', mode === 'nearest');
    $('m-zone').classList.toggle('active', mode === 'zone');
    $('hint').textContent = mode === 'nearest'
      ? 'Click the map to find the nearest entities from that point.'
      : 'Click the map to place a circular zone; enter and exit events stream in as entities cross it.';
  }

  map.on('click', (e) => (mode === 'nearest' ? nearest(e.latlng) : addZone(e.latlng)));
  $('m-nearest').onclick = () => setMode('nearest');
  $('m-zone').onclick = () => setMode('zone');
  $('m-clear').onclick = async () => {
    for (const id of [...zoneLayers.keys()]) {
      await fetch('/v1/zones/' + encodeURIComponent(id), { method: 'DELETE' });
      map.removeLayer(zoneLayers.get(id));
      zoneLayers.delete(id);
    }
  };
  $('k').oninput = () => { $('k-val').textContent = $('k').value; };
  $('radius').oninput = () => { $('radius-val').textContent = $('radius').value + ' m'; };

  function connect() {
    const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/v1/events`);
    ws.onmessage = (m) => {
      const e = JSON.parse(m.data);
      if (e.type !== 'enter' && e.type !== 'exit') return;
      eventCount++;
      const li = document.createElement('li');
      const zone = zoneLayers.get(e.zoneId);
      const name = zone ? zone.getTooltip().getContent() : e.zoneId;
      li.innerHTML = `<span><span class="badge ${e.type}">${e.type}</span> ${e.entityId}</span><span class="muted">${name}${e.reason ? ' · ' + e.reason : ''}</span>`;
      const list = $('events');
      list.insertBefore(li, list.firstChild);
      while (list.children.length > 60) list.removeChild(list.lastChild);
    };
    ws.onclose = () => setTimeout(connect, 1500);
  }

  window.geoMap = map;
  fetch('/health').then((r) => r.json()).then((h) => {
    if (h.bounds) map.fitBounds([[h.bounds.minLat, h.bounds.minLon], [h.bounds.maxLat, h.bounds.maxLon]]);
  }).catch(() => {});
  loadZones();
  connect();
  refreshEntities();
  refreshStats();
  setInterval(refreshEntities, 1000);
  setInterval(refreshStats, 1000);
  map.on('moveend', refreshEntities);
})();
</script>
</body>
</html>

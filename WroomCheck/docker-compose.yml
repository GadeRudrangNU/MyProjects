# Free local Postgres with the pgvector extension.
#   docker compose up -d db
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: wroom
      POSTGRES_PASSWORD: wroom
      POSTGRES_DB: wroomcheck
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wroom -d wroomcheck"]
      interval: 5s
      retries: 10

volumes:
  pgdata:

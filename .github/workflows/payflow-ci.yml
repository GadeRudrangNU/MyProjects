name: PayFlow CI

on:
  push:
    branches: [master]
    paths: ["PayFlow/**", ".github/workflows/payflow-*.yml"]
  pull_request:
    paths: ["PayFlow/**", ".github/workflows/payflow-*.yml"]

env:
  DJANGO_DEBUG: "1"
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/payflow

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PayFlow/backend
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: payflow }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: PayFlow/backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy .
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Tests (fails under 90% coverage)
        run: pytest --cov

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PayFlow/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: PayFlow/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  end-to-end:
    # Boots the real stack (Postgres, Redis, gunicorn, Celery worker + beat) and drives it with
    # synthetic traffic that replays real fraud-dataset rows; fails if reconciliation, idempotent
    # replays or webhook signatures are wrong.
    runs-on: ubuntu-latest
    needs: [backend]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: payflow }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CELERY_BROKER_URL: redis://localhost:6379/0
      WEBHOOK_BACKOFF_BASE_SECONDS: "2"
      WEBHOOK_SWEEP_SECONDS: "5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: PayFlow/backend/requirements*.txt
      - run: pip install -r PayFlow/backend/requirements.txt
      - name: Start API, worker and beat
        working-directory: PayFlow/backend
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo --no-frontend-env | tee seed.txt
          nohup gunicorn payflow.wsgi:application --bind 127.0.0.1:8000 --workers 3 > api.log 2>&1 &
          nohup celery -A payflow worker -l info --concurrency 4 > worker.log 2>&1 &
          nohup celery -A payflow beat -l info > beat.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/health/ && break || sleep 1; done
      - name: Simulate traffic and check invariants
        working-directory: PayFlow/backend
        run: python scripts/simulate_traffic.py --key "$(grep api_key seed.txt | cut -d= -f2)" --payments 250 --resolve-reviews
      - name: Service logs on failure
        if: failure()
        working-directory: PayFlow/backend
        run: tail -n 80 api.log worker.log

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: PayFlow/backend
          push: false
          cache-from: type=gha,scope=payflow-api
          cache-to: type=gha,scope=payflow-api,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: PayFlow/frontend
          push: false
          cache-from: type=gha,scope=payflow-web
          cache-to: type=gha,scope=payflow-web,mode=max

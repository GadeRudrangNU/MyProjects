name: ModelBench CI

on:
  push:
    branches: [master]
    paths: ["ModelBench/**", ".github/workflows/modelbench-*.yml"]
  pull_request:
    paths: ["ModelBench/**", ".github/workflows/modelbench-*.yml"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ModelBench/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ModelBench/backend/requirements*.txt
      - name: Install (CPU-only torch)
        run: |
          pip install torch --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: pytest (fails under 85% coverage)
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ModelBench/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ModelBench/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type-check and build
        run: npm run build
      - name: Jest (coverage thresholds enforced)
        run: npm run test:coverage

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t modelbench-backend ModelBench/backend
      - name: Build frontend image
        run: docker build -t modelbench-frontend ModelBench/frontend
      - name: Smoke test the backend container
        run: |
          docker run -d --name api -p 8000:8000 modelbench-backend
          for i in $(seq 1 30); do curl -sf localhost:8000/health && exit 0; sleep 2; done
          docker logs api; exit 1

name: PayFlow CodeQL

on:
  push:
    branches: [master]
    paths: ["PayFlow/**", ".github/workflows/payflow-codeql.yml", ".github/codeql/payflow-codeql.yml"]
  pull_request:
    paths: ["PayFlow/**", ".github/workflows/payflow-codeql.yml", ".github/codeql/payflow-codeql.yml"]
  schedule:
    - cron: "17 4 * * 1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/payflow-codeql.yml
      - uses: github/codeql-action/analyze@v3
        with:
          category: payflow-${{ matrix.language }}
